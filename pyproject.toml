[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhook-doorman"
version = "0.5.0"
description = "A fail-closed inbound webhook router: verify, persist, deliver."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TadMSTR" }]
keywords = ["webhook", "hmac", "router", "fastapi", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
# Bounded ranges, not bare floors. A `>=` floor with no ceiling is what vikunja#627 was: this
# fleet declared `fastmcp>=2.0`, resolved to 4.0.1 — two majors past anything tested — and the
# drift went unobserved for ten days. The floor is the oldest version supported; the ceiling is
# the next major, which is the version that is allowed to break us.
#
# uv.lock is what actually pins the build; these ranges are what Dependabot is allowed to move
# within. Both are needed — the lock without the ranges makes every bump look equally safe.
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jinja2>=3.1.4,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pyyaml>=6.0,<7",
    # structlog is CalVer, so "next major" is the next *year*, not a semantic break. 26.x is
    # current; <27 is the same intent as <next-major elsewhere in this list.
    "structlog>=24.4,<27",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Tracing is opt-in and stays out of the default install, which is nine dependencies with an
# argument for each. Nothing here is imported unless OTEL_EXPORTER_OTLP_ENDPOINT is set, and a
# missing extra with that variable set is a boot warning rather than a crash — see tracing.py.
otel = [
    # The API/SDK packages are 1.x; the instrumentation packages are still 0.x betas and move in
    # lockstep with them, which is why the two halves carry different ceilings.
    "opentelemetry-sdk>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-instrumentation-httpx>=0.48b0,<1",
]

dev = [
    "pip-audit>=2.7,<3",
    # Test-only, and deliberately not a runtime dependency: `metrics.py` emits the exposition
    # format by hand, so the claim that its output is *valid* needs a reference parser to check
    # against rather than a hand-written assertion agreeing with the hand-written emitter.
    "prometheus-client>=0.21,<1",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5.0,<8",
    "pytest-httpx>=0.30,<1",
    "ruff==0.16.6",
]

[project.scripts]
webhook-doorman = "webhook_doorman.__main__:main"

[project.urls]
Homepage = "https://github.com/TadMSTR/webhook-doorman"
Source = "https://github.com/TadMSTR/webhook-doorman"
Issues = "https://github.com/TadMSTR/webhook-doorman/issues"
Changelog = "https://github.com/TadMSTR/webhook-doorman/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_doorman"]

[tool.ruff]
line-length = 100
target-version = "py311"

# An explicit `select` is mandatory. Pinning the ruff version alone does not stop rule-set
# drift: a pin fixes which rules *exist*, not which are enabled by default.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Floor measured, not guessed, and dated so a later reader can tell a current floor from a
# stale one. Measured 96.95% on 2026-09-07 (669 tests, Python 3.13); the floor sits ~1.5 points
# below that, which absorbs ordinary churn without permitting a real regression.
#
# It was a flat 80 with no recorded measurement, which allowed a silent seventeen-point drop.
# Cite vikunja#680: searxng-mcp's floor sat unchanged for ten releases while real coverage
# climbed twelve points, so at any moment in that window the gate would have accepted a
# twelve-point regression. Ratchet this up on each bump — and do not shave it to make a red
# build green.
addopts = "--cov=webhook_doorman --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["webhook_doorman"]
branch = true
