[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhook-doorman"
version = "0.1.0"
description = "A fail-closed inbound webhook router: verify, persist, deliver."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TadMSTR" }]
keywords = ["webhook", "hmac", "router", "fastapi", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff==0.14.2",
]

[project.scripts]
webhook-doorman = "webhook_doorman.__main__:main"

[project.urls]
Homepage = "https://github.com/TadMSTR/webhook-doorman"
Source = "https://github.com/TadMSTR/webhook-doorman"
Issues = "https://github.com/TadMSTR/webhook-doorman/issues"
Changelog = "https://github.com/TadMSTR/webhook-doorman/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/webhook_doorman"]

[tool.ruff]
line-length = 100
target-version = "py311"

# An explicit `select` is mandatory. Pinning the ruff version alone does not stop rule-set
# drift: a pin fixes which rules *exist*, not which are enabled by default.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=webhook_doorman --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["webhook_doorman"]
branch = true
