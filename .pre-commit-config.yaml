# pre-commit install
#
# Same gates as CI, run locally. gitleaks is here rather than only in review because a secret
# committed once stays in the history until someone runs filter-repo.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Kept equal to the `ruff==` pin in pyproject.toml and the gitleaks version secret-scan.yml
  # installs. A hook on another version formats and lints by different rules from CI, so a
  # clean local commit could still fail the PR. Nothing bumps these automatically: change the
  # pin and the rev together.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
