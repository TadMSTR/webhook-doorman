name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  build:
    name: Build and install the artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      # Installing the built wheel, not the source tree: a packaging mistake that only shows
      # up in the artifact (a missing package directory, a bad build-backend string) is invisible
      # to an editable install and is exactly what ships to users.
      - name: Install the wheel and smoke-test the entry point
        run: |
          pip install dist/*.whl
          python -c "import webhook_doorman; print(webhook_doorman.__version__)"
          webhook-doorman --version
          webhook-doorman --config config.example.yml --check

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # pip-audit scans the *environment* by default, which has two failure modes here: a job
      # that installs only pip-audit ends up auditing pip-audit's own dependency tree and passes
      # while this project's dependencies go unchecked, and installing this project makes
      # --strict fail on webhook-doorman itself, which is not published to PyPI.
      #
      # Auditing an explicit requirements file avoids both. The list is generated from
      # pyproject.toml rather than duplicated, so a dependency added there cannot be missed here.
      - name: Extract declared dependencies
        run: |
          python - <<'PY' > requirements-audit.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print("\n".join(data["project"]["dependencies"]))
          PY
          cat requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit --strict -r requirements-audit.txt
