name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      # `[otel]` too, so the tracing happy path is actually exercised rather than skipped. The
      # degraded path — endpoint set, extra absent — does not depend on this: it forces the
      # ImportError deterministically, so it runs identically with or without the extra.
      - name: Install
        run: pip install -e ".[dev,otel]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  build:
    name: Build and install the artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      # Installing the built wheel, not the source tree: a packaging mistake that only shows
      # up in the artifact (a missing package directory, a bad build-backend string) is invisible
      # to an editable install and is exactly what ships to users.
      - name: Install the wheel and smoke-test the entry point
        run: |
          pip install dist/*.whl
          python -c "import webhook_doorman; print(webhook_doorman.__version__)"
          webhook-doorman --version
          webhook-doorman --config config.example.yml --check

  image:
    name: Image build and verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # amd64 only here — this job is a correctness gate on every PR, and the arm64 leg is
      # emulated and slow. The publish workflow builds both, and runs this same script against
      # the amd64 artefact before it pushes either.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: webhook-doorman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Image contents, runtime uid, the entry point and `--check`, a dependency audit of the
      # tree that actually shipped, and the HTTP service contract.
      #
      # These gates live in a script rather than inline here for one reason: publish.yml must
      # run the identical set before it pushes to GHCR. When they were inline, the publish path
      # pushed an artefact nothing had verified, and anything added here would silently not
      # apply there. See the header of .github/ci/verify-image.sh.
      - name: Verify the built image
        run: .github/ci/verify-image.sh webhook-doorman:ci


  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # pip-audit scans the *environment* by default, which has two failure modes here: a job
      # that installs only pip-audit ends up auditing pip-audit's own dependency tree and passes
      # while this project's dependencies go unchecked, and installing this project makes
      # --strict fail on webhook-doorman itself, which is not published to PyPI.
      #
      # Auditing an explicit requirements file avoids both. The list is generated from
      # pyproject.toml rather than duplicated, so a dependency added there cannot be missed here.
      - name: Extract declared dependencies
        run: |
          python - <<'PY' > requirements-audit.txt
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          print("\n".join(data["project"]["dependencies"]))
          PY
          cat requirements-audit.txt

      - name: Audit dependencies
        run: pip-audit --strict -r requirements-audit.txt
