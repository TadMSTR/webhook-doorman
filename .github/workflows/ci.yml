name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read; nothing here pushes.
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # `[otel]` too, so the tracing happy path is actually exercised rather than skipped. The
      # degraded path — endpoint set, extra absent — does not depend on this: it forces the
      # ImportError deterministically, so it runs identically with or without the extra.
      #
      # Deliberately installs from the declared ranges, NOT from uv.lock, and that asymmetry is
      # the point: this job answers "do the versions we permit still work", while the image
      # gates answer "is the version set we actually ship sound". Pinning this to the lock too
      # would leave nothing watching the ceilings in pyproject.toml, and a range that has
      # silently stopped working is how vikunja#627 went unnoticed for ten days.
      - name: Install
        run: pip install -e ".[dev,otel]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  # The image's Python and the test matrix are two declarations of one fact, and nothing kept
  # them aligned: a base-image bump (Dependabot #7, 3.13 -> 3.14) was green and would have
  # shipped an interpreter the suite never ran on (vikunja#729). This turns the coincidence
  # into a checked property. A base-image bump now fails here until the matrix gains the
  # same version, so the two have to land in one PR.
  python-parity:
    name: Image Python is in the test matrix
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read; nothing here pushes.
          persist-credentials: false

      # Each assertion has a floor. A grep that matches nothing yields an empty list, and an
      # empty list "agrees" with anything, so an unparsed file must fail rather than pass.
      - name: Assert every FROM python:X.Y is a matrix entry
        run: |
          set -euo pipefail
          images=$(grep -oE '^FROM python:[0-9]+\.[0-9]+' Dockerfile | sed 's/^FROM python://' | sort -u)
          matrix=$(grep -E '^\s+python-version: \[' .github/workflows/ci.yml | grep -oE '"[0-9]+\.[0-9]+"' | tr -d '"')
          [ -n "$images" ] || { echo "::error::no 'FROM python:X.Y' line found in Dockerfile"; exit 1; }
          [ -n "$matrix" ] || { echo "::error::no python-version matrix found in ci.yml"; exit 1; }
          echo "image Python: $images"; echo "matrix: $(echo $matrix)"
          for v in $images; do
            echo "$matrix" | grep -qx "$v" || { echo "::error file=Dockerfile::image ships Python $v, which the test matrix does not run"; exit 1; }
          done

  build:
    name: Build and install the artifact
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read; nothing here pushes.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      # Installing the built wheel, not the source tree: a packaging mistake that only shows
      # up in the artifact (a missing package directory, a bad build-backend string) is invisible
      # to an editable install and is exactly what ships to users.
      - name: Install the wheel and smoke-test the entry point
        run: |
          pip install dist/*.whl
          python -c "import webhook_doorman; print(webhook_doorman.__version__)"
          webhook-doorman --version
          webhook-doorman --config config.example.yml --check

      # Every shipped example, through the INSTALLED wheel's CLI, on every PR.
      #
      # tests/test_examples.py already loads each example via load_config(), so this is not the
      # first thing to read them. It is a different claim: that `webhook-doorman --check` — the
      # command an adopter actually runs before a deploy — works against the built artefact.
      # A packaging fault that breaks the entry point is invisible to a library-level test.
      #
      # A config router whose own published examples do not load is the worst failure available
      # to it. searxng-mcp's compose examples rotted exactly that way — syntactically present,
      # functionally wrong, because nothing exercised them on a PR.
      #
      # The count assertion is not decoration. `for f in examples/*.yml` over an empty or
      # renamed directory iterates zero times and exits 0, so without a floor this step would
      # report success precisely when it had stopped checking anything.
      - name: Check every shipped example parses
        run: |
          shopt -s nullglob
          files=(examples/*.yml)
          echo "found ${#files[@]} example(s)"
          [ "${#files[@]}" -ge 5 ] || { echo "::error::expected at least 5 examples, found ${#files[@]} — this gate is not checking what it claims"; exit 1; }
          for f in "${files[@]}"; do
            echo "--- $f"
            webhook-doorman --config "$f" --check
          done

  image:
    name: Image build and verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read; nothing here pushes.
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only here — this job is a correctness gate on every PR, and the arm64 leg is
      # emulated and slow. The publish workflow builds both, and runs this same script against
      # the amd64 artefact before it pushes either.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: webhook-doorman:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # Image contents, runtime uid, the entry point and `--check`, a dependency audit of the
      # tree that actually shipped, and the HTTP service contract.
      #
      # These gates live in a script rather than inline here for one reason: publish.yml must
      # run the identical set before it pushes to GHCR. When they were inline, the publish path
      # pushed an artefact nothing had verified, and anything added here would silently not
      # apply there. See the header of .github/ci/verify-image.sh.
      - name: Verify the built image
        run: .github/ci/verify-image.sh webhook-doorman:ci


  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read; nothing here pushes.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install pip-audit
        run: pip install pip-audit

      # A lockfile that has drifted from pyproject.toml describes a tree nobody installs, which
      # is the same defect this job was rebuilt to remove, relocated one file over. `--check`
      # fails on drift instead of silently re-resolving to paper over it.
      - name: Assert the lockfile matches pyproject.toml
        run: uv lock --check

      # Two gates, not one widened gate. Merging them makes "something we ship is vulnerable"
      # indistinguishable from "something we build with is vulnerable", and those warrant
      # different urgency and different responses.
      #
      # There is deliberately no third gate for container sub-projects — the Flagship standard
      # asks for one where they exist and this repo has none. The image is built from this same
      # workspace and this same lock, and is audited from its own installed tree in the `image`
      # job above. Stated rather than left as an apparent omission.
      #
      # `--locked` against an exported PEP 751 pylock reads the pinned versions and resolves
      # nothing. This job previously extracted `project.dependencies` — range specs — into a
      # requirements file and ran `pip-audit -r` on it, which re-resolves and therefore reported
      # on whatever a fresh install would get that minute. `-r` is not a fix for this even with
      # exact pins: it runs a pip dry-run resolution regardless of --no-deps. That is
      # vikunja#670, and vikunja#633 is the case where the same shape read a dependency green
      # while the deployed container ran a version with four HIGH advisories.
      - name: Audit runtime dependencies
        run: |
          mkdir -p audit-runtime
          uv export --frozen --no-dev --extra otel --no-emit-project \
            --format pylock.toml -o audit-runtime/pylock.toml
          pip-audit --strict --locked audit-runtime

      # Dev dependencies were not audited at all before this. They are not shipped, but they run
      # in CI with a checkout and a token.
      - name: Audit dev dependencies
        run: |
          mkdir -p audit-dev
          uv export --frozen --extra dev --extra otel --no-emit-project \
            --format pylock.toml -o audit-dev/pylock.toml
          pip-audit --strict --locked audit-dev

  # Mutation testing on the three security modules: does a test fail when the code changes?
  # Line coverage cannot answer that, and #759 was the case: `compare_digest` -> `!=` in
  # verify_hmac survived the whole suite at 97% coverage. Per-module survivor ceilings and
  # mutant floors are in tests/check_mutation_floor.py, measured, with the reasoning.
  #
  # Installed from the lock, not the ranges: a mutation score is only comparable run to run if
  # the same mutmut and the same pytest produced it.
  mutation:
    name: Mutation (security modules)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No token left in .git/config for later steps to read; nothing here pushes.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install the locked dev environment
        run: uv sync --frozen --extra dev --extra otel --python 3.13

      - name: Run mutmut
        run: |
          set -euo pipefail
          source .venv/bin/activate
          mutmut run --max-children 4

      - name: Assert the survivor ceilings and mutant floors
        run: |
          source .venv/bin/activate
          python tests/check_mutation_floor.py

