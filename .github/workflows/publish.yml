name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]

# Least privilege at the top; jobs escalate individually, next to the step that needs it.
# Without a top-level block GitHub's default is write, and that failure is silent — OSSF
# Scorecard's Token-Permissions check is what surfaces it.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/webhook-doorman

jobs:
  image:
    name: Build, verify and publish multi-arch image
    runs-on: ubuntu-latest

    # Scoped to this job rather than the workflow. `packages: write` is what lets the built-in
    # GITHUB_TOKEN push to GHCR; the `release` job below has no business holding it, and at
    # workflow level it did. `id-token` and `attestations` are for the provenance step.
    #
    # No PAT and no repository secret: publishing to GHCR from Actions uses the workflow's
    # built-in GITHUB_TOKEN with github.actor as the username. A personal access token here
    # would be a long-lived credential doing a job an ephemeral one already does.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # arm64 matters: adopters run this on a Pi or a NAS, not only on amd64 servers.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # --- build, verify, then push. In that order, and it is the point of this job's shape. --
      #
      # This previously built and pushed in a single step with `push: true`, which meant the
      # first thing to touch the artefact was GHCR. A test that runs after the push tells you
      # what you have already shipped.
      #
      # Splitting it costs a second build. `load: true` cannot take a multi-arch manifest, so
      # the verification build is amd64 only; the multi-arch build that follows reuses the same
      # buildx cache and the same lockfile, so the amd64 layers it pushes are the ones verified
      # here.
      #
      # The arm64 leg is built from the identical Dockerfile and the identical lockfile but is
      # NOT itself smoke-tested — doing so would mean running the service under QEMU emulation
      # on every publish. Said plainly rather than left for a reader to assume the whole
      # manifest was exercised. If an arm64-specific regression is ever seen, this is the gap
      # it came through.
      - name: Build amd64 image for verification
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: webhook-doorman:verify
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      # The same script ci.yml runs on every PR: contents, runtime uid, entry point, a
      # dependency audit of the tree that actually shipped, and the HTTP service contract.
      # Running the identical file is deliberate — a publish-path copy of these gates would
      # drift from the PR-path ones, and the drift would only be visible after a bad publish.
      - name: Verify the image before publishing
        run: .github/ci/verify-image.sh webhook-doorman:verify

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # `actions/attest-build-provenance` rather than build-push-action's own `provenance:`
      # input. Both are legitimate; this one is chosen because it produces a signed sigstore
      # bundle attached to the digest, which is what the Flagship standard names and what the
      # rest of this fleet already uses — one verification procedure for every published image
      # rather than two.
      #
      # DO NOT REMOVE THIS ON THE STRENGTH OF A 404. GHCR does not implement the referrers API
      # (`GET /v2/<name>/referrers/<digest>`) and returns 404 MANIFEST_UNKNOWN even when the
      # attestation succeeded — it uses the OCI spec's fallback tag scheme instead, publishing
      # the referrers index under a tag named `sha256-<digest>`. vikunja#699 is open precisely
      # to stop this being "fixed" again; vikunja#689 already reported it once as a no-op and
      # was wrong.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: |
            ```
            docker pull ghcr.io/tadmstr/webhook-doorman:${{ github.ref_name }}
            ```
